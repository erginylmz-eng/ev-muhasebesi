name: Test

on:
  push:
  pull_request:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur
        run: npm install

      - name: Backend (server/) bağımlılıklarını kur
        # tests/server-smoke.test.js, server/server.js'i gerçek bir Node
        # süreci olarak başlatıyor (express, google-auth-library, vb. gerekir).
        # server/, kökten AYRI bir package.json'a sahip (kendi başına
        # dağıtılabilmesi için) — bu yüzden npm install kökte otomatik olarak
        # bunu kurmaz.
        run: npm install
        working-directory: server

      - name: Playwright Chromium'u kur
        run: npx playwright install --with-deps chromium

      - name: Derle ve tüm regresyon testlerini çalıştır
        run: npm test
