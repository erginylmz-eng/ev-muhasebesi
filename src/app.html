<title>Yılmaz Hane Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="app-style">
  :root{
    color-scheme: light;
    --bg: #f5f1e7;
    --surface: #fffdf8;
    --surface-2: #fbf6ea;
    --ink: #1d221f;
    --ink-2: #5b6259;
    --ink-mute: #8b9187;
    --border: #e3ddc9;
    --border-strong: #cfc7ab;
    --accent: #2c4a56;
    --accent-2: #3e6675;
    --accent-soft: #e0eaec;
    --accent-ink: #ffffff;
    --income: #1e7a46;
    --income-soft: #dcf0e4;
    --expense: #ab3b2c;
    --expense-soft: #f6e2dd;
    --warning: #92650b;
    --warning-soft: #f7ecd4;
    --critical: #8c2222;
    --critical-soft: #f6dede;
    --shadow: 0 1px 2px rgba(30,25,10,0.06), 0 6px 20px -10px rgba(30,25,10,0.18);
    --slot-1:#2a78d6; --slot-2:#eb6834; --slot-3:#1baf7a; --slot-4:#c98500;
    --slot-5:#d55181; --slot-6:#1f7a1f; --slot-7:#4a3aa7; --slot-8:#e34948;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #17181a;
      --surface: #1f2123;
      --surface-2: #24262a;
      --ink: #f1efe9;
      --ink-2: #b8bcb2;
      --ink-mute: #83887f;
      --border: #34373a;
      --border-strong: #45494d;
      --accent: #7fa6b3;
      --accent-2: #9dc0cb;
      --accent-soft: #26363a;
      --accent-ink: #10191b;
      --income: #6fce93;
      --income-soft: #1c332480;
      --expense: #e8917f;
      --expense-soft: #3a231f80;
      --warning: #e0b256;
      --warning-soft: #3a2f1780;
      --critical: #ef9a8e;
      --critical-soft: #3a201d80;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -10px rgba(0,0,0,0.5);
      --slot-1:#3987e5; --slot-2:#d95926; --slot-3:#199e70; --slot-4:#c98500;
      --slot-5:#d55181; --slot-6:#3f9d3f; --slot-7:#9085e9; --slot-8:#e66767;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #17181a;
    --surface: #1f2123;
    --surface-2: #24262a;
    --ink: #f1efe9;
    --ink-2: #b8bcb2;
    --ink-mute: #83887f;
    --border: #34373a;
    --border-strong: #45494d;
    --accent: #7fa6b3;
    --accent-2: #9dc0cb;
    --accent-soft: #26363a;
    --accent-ink: #10191b;
    --income: #6fce93;
    --income-soft: #1c332480;
    --expense: #e8917f;
    --expense-soft: #3a231f80;
    --warning: #e0b256;
    --warning-soft: #3a2f1780;
    --critical: #ef9a8e;
    --critical-soft: #3a201d80;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -10px rgba(0,0,0,0.5);
    --slot-1:#3987e5; --slot-2:#d95926; --slot-3:#199e70; --slot-4:#c98500;
    --slot-5:#d55181; --slot-6:#3f9d3f; --slot-7:#9085e9; --slot-8:#e66767;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  h1,h2,h3,.display{ font-family:"Fraunces","IBM Plex Sans",serif; font-weight:600; text-wrap:balance; margin:0; }
  .num{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }

  a{ color:inherit; }
  button{ font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent-2); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

  /* header */
  .topbar{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:18px 18px 10px; display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid transparent;
  }
  .topbar .brand{ font-size:1.25rem; letter-spacing:-0.01em; }
  .topbar .brand small{ display:block; font-family:"IBM Plex Sans"; font-weight:400; font-size:0.72rem; color:var(--ink-mute); letter-spacing:0.04em; text-transform:uppercase; margin-top:2px;}
  .readonly-chip{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; background:var(--warning-soft); color:var(--warning); padding:4px 9px; border-radius:20px; font-weight:600; }

  /* giriş perdesi */
  .gate-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px; box-shadow:var(--shadow); }
  .gate-people{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .gate-person-btn{ width:100%; justify-content:flex-start; }

  main{ flex:1; padding:6px 18px 100px; }

  /* cards */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; box-shadow:var(--shadow); }
  .card + .card{ margin-top:12px; }
  .recur-banner{ border-color:var(--accent-2); }
  .recur-banner-head{ display:flex; align-items:center; gap:8px; font-weight:600; margin-bottom:10px; color:var(--accent); }
  .recur-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--border); }
  .recur-item:first-of-type{ border-top:none; }
  .recur-item-main .n{ font-weight:600; font-size:0.92rem; }
  .recur-item-main .s{ font-size:0.78rem; color:var(--ink-2); margin-top:2px; }
  .recur-item-actions{ display:flex; gap:6px; flex:none; }
  .forecast-tile{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
  .section-title{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-mute); font-weight:600; margin:22px 0 8px; }
  .section-title:first-child{ margin-top:6px; }

  .hero{
    background:linear-gradient(155deg, var(--accent) 0%, var(--accent-2) 100%);
    color:var(--accent-ink); border-radius:14px; padding:20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:14px;
  }
  .hero .label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; opacity:0.85; }
  .hero .figure{ font-size:2.15rem; font-weight:600; line-height:1.1; }
  .hero .figure.neg{ color:#ffd9d2; }
  .hero-row{ display:flex; justify-content:space-between; gap:14px; }
  .hero-sub{ display:flex; gap:18px; flex-wrap:wrap; }
  .hero-sub div{ font-size:0.78rem; opacity:0.9; }
  .hero-sub .v{ display:block; font-size:1rem; font-weight:600; margin-top:2px; opacity:1; }

  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stack{ display:flex; flex-direction:column; gap:2px; }
  .muted{ color:var(--ink-2); font-size:0.85rem; }
  .mute2{ color:var(--ink-mute); font-size:0.76rem; }

  .btn{
    appearance:none; border:1px solid var(--border-strong); background:var(--surface);
    color:var(--ink); border-radius:8px; padding:9px 14px; font-size:0.88rem; font-weight:500;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent-2); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-2); border-color:var(--accent-2); }
  .btn-ghost{ border-color:transparent; background:transparent; padding:6px 8px; }
  .btn-danger{ color:var(--critical); border-color:var(--critical-soft); background:var(--critical-soft); }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:6px 10px; font-size:0.78rem; border-radius:7px; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }
  .icon{ width:16px; height:16px; flex:none; display:inline-flex; }
  .icon svg{ width:100%; height:100%; display:block; }
  .icon-lg{ width:20px; height:20px; }

  .fab{
    position:fixed; right:calc(50% - 280px + 18px); bottom:82px; z-index:6;
    width:54px; height:54px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    border:none; box-shadow:0 10px 24px -8px rgba(20,20,10,0.4); display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  @media (max-width:596px){ .fab{ right:18px; } }
  .fab:hover{ background:var(--accent-2); }

  /* tab bar */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface);
    border-top:1px solid var(--border); display:flex; justify-content:center;
  }
  .tabbar-inner{ max-width:560px; width:100%; display:flex; }
  .tab-btn{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 4px 10px; color:var(--ink-mute); cursor:pointer; font-size:0.66rem; font-weight:500; letter-spacing:0.01em;
  }
  .tab-btn[aria-current="true"]{ color:var(--accent); }
  .tab-btn .icon{ width:21px; height:21px; }

  /* lists */
  .tx-row{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
  .tx-row:last-child{ border-bottom:none; }
  .tx-badge{ width:38px; height:38px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-size:1rem; font-weight:600; color:#fff; }
  .tx-main{ flex:1; min-width:0; }
  .tx-main .t{ font-size:0.9rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-main .s{ font-size:0.76rem; color:var(--ink-mute); }
  .tag-camera{ width:12px; height:12px; margin-left:5px; vertical-align:-1px; color:var(--ink-mute); }
  .tag-chips{ display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .tag-chip{ font-size:0.68rem; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2); border-radius:8px; padding:1px 7px; }
  .tx-amt{ font-size:0.92rem; font-weight:600; white-space:nowrap; }
  .tx-amt.income{ color:var(--income); }
  .tx-amt.expense{ color:var(--expense); }
  .tx-row{ cursor:pointer; }

  .empty{ text-align:center; padding:34px 10px; color:var(--ink-mute); }
  .empty .icon-lg{ width:34px; height:34px; margin-bottom:10px; opacity:0.6; }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:0.72rem; font-weight:600; padding:3px 9px; border-radius:20px; }
  .pill-income{ background:var(--income-soft); color:var(--income); }
  .pill-expense{ background:var(--expense-soft); color:var(--expense); }
  .pill-warning{ background:var(--warning-soft); color:var(--warning); }
  .pill-critical{ background:var(--critical-soft); color:var(--critical); }
  .pill-neutral{ background:var(--surface-2); color:var(--ink-2); border:1px solid var(--border); }

  .chips{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin:0 -2px; }
  .chip{ flex:none; border:1px solid var(--border-strong); background:var(--surface); border-radius:20px; padding:6px 13px; font-size:0.8rem; color:var(--ink-2); cursor:pointer; }
  .chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  /* forms */
  label{ display:block; font-size:0.78rem; font-weight:600; color:var(--ink-2); margin-bottom:5px; }
  input, select, textarea{
    width:100%; font-size:0.95rem; padding:10px 11px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--ink); font-family:inherit;
  }
  input.num, .amount-input{ font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seg{ display:flex; border:1px solid var(--border-strong); border-radius:9px; overflow:hidden; }
  .seg button{ flex:1; border:none; background:var(--surface); padding:10px; font-size:0.85rem; font-weight:500; color:var(--ink-2); cursor:pointer; border-right:1px solid var(--border-strong); }
  .seg.seg-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .seg.seg-scroll button{ flex:0 0 auto; padding:10px 14px; white-space:nowrap; }
  .seg button:last-child{ border-right:none; }
  .seg button[aria-pressed="true"]{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .cat-field-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; }
  .cat-field-head label{ margin-bottom:0; }
  .cat-edit-toggle{ background:none; border:none; color:var(--accent); font-size:0.76rem; font-weight:600; cursor:pointer; padding:2px 4px; }
  .cat-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .cat-opt{ width:100%; border:1px solid var(--border-strong); background:var(--surface); border-radius:9px; padding:9px 6px; font-size:0.76rem; text-align:center; cursor:pointer; color:var(--ink-2); line-height:1.25; }
  .cat-opt span{ display:block; width:9px; height:9px; border-radius:50%; margin:0 auto 5px; }
  .cat-opt[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); font-weight:600; }
  .cat-opt-wrap{ position:relative; }
  .cat-opt-wrap.editing .cat-opt{ opacity:0.72; }
  .cat-del{ position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; background:var(--critical); border:2px solid var(--surface); color:#fff; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .cat-del .icon{ width:11px; height:11px; }
  .cat-opt-add{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--accent); border-style:dashed; background:transparent; }
  .cat-opt-add .icon{ width:14px; height:14px; margin:0 auto; }
  .cat-add-row{ display:flex; gap:6px; margin-top:8px; }
  .cat-add-row input{ flex:1; }
  .tmpl-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .tmpl-chip-wrap{ position:relative; flex:none; }
  .tmpl-chip{ border:1px solid var(--border-strong); background:var(--surface-2); border-radius:20px; padding:8px 16px; font-size:0.82rem; color:var(--ink-2); cursor:pointer; white-space:nowrap; }
  .tmpl-del{ position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--critical); border:2px solid var(--surface); color:#fff; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .tmpl-del .icon{ width:10px; height:10px; }

  /* sheet / modal */
  .sheet-overlay{ position:fixed; inset:0; background:rgba(20,18,10,0.42); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet-overlay.hidden{ display:none; }
  .sheet{ background:var(--surface); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:18px 18px 26px; box-shadow:0 -12px 30px rgba(0,0,0,0.25); }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-head h2{ font-size:1.15rem; }
  .checkbox-label{ display:flex; align-items:center; gap:8px; font-size:0.9rem; font-weight:500; color:var(--ink); cursor:pointer; }
  .checkbox-label input{ width:auto; }
  .receipt-preview{ display:flex; align-items:center; gap:10px; }
  .receipt-preview img{ width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border-strong); cursor:pointer; }
  .receipt-overlay{ z-index:40; align-items:center; padding:20px; box-sizing:border-box; }
  .receipt-full{ max-width:92vw; max-height:92vh; border-radius:10px; box-shadow:var(--shadow); }

  .confirm-card{ max-width:400px; border-radius:14px; margin:auto; }
  .confirm-actions{ display:flex; gap:10px; margin-top:18px; }
  .confirm-actions .btn{ flex:1; }

  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:150px; z-index:30; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:9px; font-size:0.85rem; box-shadow:var(--shadow); max-width:78%; text-align:center; }
  :root:not([data-theme="light"]) .toast{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border-strong); }
  :root[data-theme="dark"] .toast{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border-strong); }

  /* accounts */
  .acct-card{ display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
  .acct-card:last-child{ border-bottom:none; }
  .acct-icon{ width:40px; height:40px; border-radius:9px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex:none; }
  .acct-main{ flex:1; min-width:0; }
  .acct-main .n{ font-weight:600; font-size:0.92rem; }
  .acct-main .t{ font-size:0.75rem; color:var(--ink-mute); }
  .acct-bal{ text-align:right; }
  .acct-bal .v{ font-weight:600; font-size:0.95rem; }
  .limit-bar{ height:6px; border-radius:4px; background:var(--border); overflow:hidden; margin-top:8px; }
  .limit-bar > div{ height:100%; background:var(--accent-2); }
  .limit-bar.warn > div{ background:var(--warning); }
  .limit-bar.crit > div{ background:var(--critical); }

  /* bars / charts */
  .bar-row{ margin-bottom:12px; }
  .bar-row .bhead{ display:flex; justify-content:space-between; font-size:0.82rem; margin-bottom:5px; }
  .bar-track{ height:10px; border-radius:5px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; display:flex; }
  .bar-fill{ height:100%; border-radius:5px 0 0 5px; }
  .bar-fill-planned{ opacity:0.4; margin-left:2px; background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.4) 0 3px, transparent 3px 6px); }
  .legend{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px; }
  .goal-card{ padding:12px 0; border-top:1px solid var(--border); }
  .goal-card:first-of-type{ border-top:none; padding-top:0; }
  .goal-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .goal-head .n{ font-weight:600; font-size:0.92rem; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--ink-2); }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .legend-dot-planned{ width:9px; height:9px; border-radius:50%; flex:none; background:var(--ink-mute); opacity:0.6; background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0 2px, transparent 2px 4px); }
  .trend-chart{ display:flex; align-items:flex-end; gap:14px; height:150px; padding-top:8px; }
  .trend-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
  .trend-col-future .trend-label{ font-style:italic; }
  .trend-bars{ display:flex; gap:4px; align-items:flex-end; height:100%; }
  .trend-bar-stack{ display:flex; flex-direction:column; height:100%; width:11px; }
  .trend-bar{ width:11px; border-radius:3px 3px 0 0; position:relative; }
  .trend-bar-planned{ opacity:0.4; margin-bottom:2px; background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.4) 0 3px, transparent 3px 6px); }
  .trend-label{ font-size:0.68rem; color:var(--ink-mute); }

  /* Net Varlık Grafiği: sıfır çizgisine göre pozitif (yukarı, yeşil) / negatif
     (aşağı, kırmızı) çubuklar — Özet ekranında, kayıt girilen tüm aylar için. */
  .networth-chart{ display:flex; align-items:stretch; gap:10px; height:172px; padding:6px 4px 0; min-width:max-content; }
  .nw-col{ display:flex; flex-direction:column; align-items:center; width:34px; flex:none; }
  .nw-col-current .nw-label{ font-weight:700; color:var(--ink); }
  .nw-bar-wrap{ position:relative; height:140px; width:100%; }
  .nw-bar-wrap::before{ content:''; position:absolute; left:0; right:0; top:50%; height:0; border-top:1px dashed var(--ink-mute); opacity:0.5; }
  .nw-bar{ position:absolute; left:5px; right:5px; }
  .nw-bar.nw-pos{ bottom:50%; background:var(--income); border-radius:3px 3px 0 0; }
  .nw-bar.nw-neg{ top:50%; background:var(--expense); border-radius:0 0 3px 3px; }
